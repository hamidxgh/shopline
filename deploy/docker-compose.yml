services:
  postgres:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_USER: shopline
      POSTGRES_PASSWORD: shopline
      POSTGRES_DB: shopline
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopline"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres-replica:
    image: postgres:17-alpine
    ports:
      - 5433:5432
    environment:
      PGPASSWORD: replpass
    entrypoint:
      - bash
      - -ec
      - |
        until pg_isready -h postgres -U shopline; do sleep 1; done
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          rm -rf /var/lib/postgresql/data/*
          pg_basebackup -h postgres -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R
          chown -R postgres:postgres /var/lib/postgresql/data
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - pgreplica:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopline"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host=0.0.0.0", "-config=/proxies.json"]
    ports:
      - "8474:8474"
    volumes:
      - ./toxiproxy/proxies.json:/proxies.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      timeout: 2s
      retries: 15

  etcd:
    image: registry.k8s.io/etcd:3.5.21-0
    command:
      - etcd
      - --name=s1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=s1=http://etcd:2380
      - --initial-cluster-state=new
    ports:
      - 2379:2379
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v25.1.1
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - 19092:19092
    healthcheck:
      test:
        ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    ports:
      - 8083:8083
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: shopline-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shopline
      MINIO_ROOT_PASSWORD: shopline-secret
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  varnish:
    image: varnish:stable
    ports:
      - 8082:80
    environment:
      VARNISH_SIZE: 64M
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    ulimits:
      memlock: -1
    tmpfs:
      - /var/lib/varnish/varnishd:exec
    depends_on:
      - nginx

  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    ports:
      - 7700:7700
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: shopline-masterkey
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    dns:
      - 172.28.0.53
    environment:
      DATABASE_URL: postgres://shopline:shopline@db.shopline.local:5432/shopline
      DATABASE_REPLICA_URL: postgres://shopline:shopline@postgres-replica:5432/shopline
      REDIS_ADDR: toxiproxy:16379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      KAFKA_BROKERS: redpanda:9092
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: shopline
      S3_SECRET_KEY: shopline-secret
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: shopline-masterkey
      ETCD_ENDPOINTS: etcd:2379
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      KEYCLOAK_ISSUER: http://localhost:8084/realms/shopline
      KEYCLOAK_DISCOVERY: http://keycloak:8080/realms/shopline
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: shopline
      CLICKHOUSE_PASSWORD: shopline
      CLICKHOUSE_DB: shopline
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_started
      toxiproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      etcd:
        condition: service_healthy
      jaeger:
        condition: service_started
      keycloak:
        condition: service_started
      vault:
        condition: service_started
      coredns:
        condition: service_started
      clickhouse:
        condition: service_healthy
    deploy:
      replicas: 3

  nginx:
    image: nginx:1.29-alpine
    ports:
      - 8080:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - traefik

  traefik:
    image: traefik:v3.5
    ports:
      - 8081:8080
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    command: ["--query.ui-config=/etc/jaeger/jaeger-ui.json"]
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    volumes:
      - ./jaeger/jaeger-ui.json:/etc/jaeger/jaeger-ui.json:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8084:8080"
    volumes:
      - ./keycloak/shopline-realm.json:/opt/keycloak/data/import/shopline-realm.json:ro

  vault:
    image: hashicorp/vault:2.2.0
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK

  coredns:
    image: coredns/coredns:1.14.7
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.28.0.53

  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      CLICKHOUSE_DB: shopline
      CLICKHOUSE_USER: shopline
      CLICKHOUSE_PASSWORD: shopline
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  pgreplica:
  miniodata:
  meilidata:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
